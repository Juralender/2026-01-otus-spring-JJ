apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.fullnameOverride }}
  labels:
    app: {{ .Values.fullnameOverride }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.fullnameOverride }}
  ports:
    - name: postgresql
      port: {{ .Values.service.port }}
      targetPort: postgresql
