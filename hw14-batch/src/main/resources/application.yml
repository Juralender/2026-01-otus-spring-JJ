spring:
  datasource:
    url: jdbc:h2:file:./data/library
  liquibase:
    change-log: db/changelog/db.changelog-master.yaml
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  data:
    mongodb:
      uri: mongodb://localhost:27017/maindb

migration:
  chunk-size: 100
  threads: 4
