<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(title=(${bookForm.id == 0} ? 'New book' : 'Edit book'))}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<h1 th:text="${bookForm.id == 0} ? 'New book' : 'Edit book'">Book form</h1>

<form method="post" th:object="${bookForm}"
      th:action="${bookForm.id == 0} ? @{/books} : @{/books/{id}(id=${bookForm.id})}">

    <label for="title">Title</label>
    <input id="title" type="text" th:field="*{title}"/>
    <div class="error-message" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">Title error</div>

    <label for="authorId">Author</label>
    <select id="authorId" th:field="*{authorId}">
        <option th:each="author : ${authors}" th:value="${author.id}" th:text="${author.fullName}"></option>
    </select>

    <label for="genreIds">Genres</label>
    <select id="genreIds" th:field="*{genreIds}" multiple="multiple">
        <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.name}"></option>
    </select>

    <div class="buttons">
        <button type="submit">Save</button>
        <a th:href="@{/books}">Cancel</a>
    </div>
</form>
</body>
</html>
