<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(title='Books')}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<h1>Books</h1>

<a th:href="@{/books/new}">Add new book</a>

<table>
    <thead>
    <tr>
        <th>Title</th>
        <th>Author</th>
        <th>Genres</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="book : ${books}">
        <td th:text="${book.title}">Title</td>
        <td th:text="${book.author.fullName}">Author</td>
        <td th:text="${#strings.listJoin(book.genres.![name], ', ')}">Genres</td>
        <td class="actions">
            <a th:href="@{/books/{id}(id=${book.id})}">View</a>
            <a th:href="@{/books/{id}/edit(id=${book.id})}">Edit</a>
            <form class="inline" method="post" th:action="@{/books/{id}/delete(id=${book.id})}"
                  onsubmit="return confirm('Delete this book?');">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
