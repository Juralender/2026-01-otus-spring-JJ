<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/common :: head(title=${book.title})}"></head>
<body>
<nav th:replace="~{fragments/common :: nav}"></nav>

<h1 th:text="${book.title}">Title</h1>
<p><strong>Author:</strong> <span th:text="${book.author.fullName}">Author</span></p>
<p><strong>Genres:</strong> <span th:text="${#strings.listJoin(book.genres.![name], ', ')}">Genres</span></p>

<div class="buttons">
    <a th:href="@{/books/{id}/edit(id=${book.id})}">Edit</a>
    <form class="inline" method="post" th:action="@{/books/{id}/delete(id=${book.id})}"
          onsubmit="return confirm('Delete this book?');">
        <button type="submit">Delete</button>
    </form>
    <a th:href="@{/books}">Back to books</a>
</div>

<h2>Comments</h2>
<div class="comment" th:each="comment : ${comments}">
    <p th:text="${comment.text}">Comment text</p>
    <form method="post" th:action="@{/books/{bookId}/comments/{commentId}/delete(bookId=${book.id},commentId=${comment.id})}"
          onsubmit="return confirm('Delete this comment?');">
        <button type="submit">Delete</button>
    </form>
</div>
<p th:if="${#lists.isEmpty(comments)}">No comments yet.</p>

<h3>Add comment</h3>
<form method="post" th:action="@{/books/{id}/comments(id=${book.id})}" th:object="${newComment}">
    <label for="text">Text</label>
    <input id="text" type="text" th:field="*{text}"/>
    <div class="buttons">
        <button type="submit">Add comment</button>
    </div>
</form>
</body>
</html>
