databaseChangeLog:
  - changeSet:
      id: 1-create-authors-table
      author: otus
      changes:
        - createTable:
            tableName: authors
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: full_name
                  type: VARCHAR(255)
  - changeSet:
      id: 2-create-genres-table
      author: otus
      changes:
        - createTable:
            tableName: genres
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
  - changeSet:
      id: 3-create-books-table
      author: otus
      changes:
        - createTable:
            tableName: books
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(255)
              - column:
                  name: author_id
                  type: BIGINT
                  constraints:
                    foreignKeyName: fk_books_author
                    references: authors(id)
                    deleteCascade: true
  - changeSet:
      id: 4-create-books-genres-table
      author: otus
      changes:
        - createTable:
            tableName: books_genres
            columns:
              - column:
                  name: book_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    foreignKeyName: fk_books_genres_book
                    references: books(id)
                    deleteCascade: true
              - column:
                  name: genre_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    foreignKeyName: fk_books_genres_genre
                    references: genres(id)
                    deleteCascade: true
